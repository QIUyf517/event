services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EVENT_RESEARCH_DATABASE_PATH: /app/data/event_research.sqlite3
      EVENT_GRAPH_DATABASE_PATH: /app/data/event_graph.sqlite3
    volumes:
      - event-data:/app/data
      - event-output:/app/output
    restart: unless-stopped

volumes:
  event-data:
  event-output:
