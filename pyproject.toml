[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-etf-research-agent"
version = "0.1.0"
description = "A股ETF公开资料与资金信号研究助手"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "streamlit>=1.32"]

[project.optional-dependencies]
market = ["akshare>=1.12", "numpy<2"]
dev = ["pytest>=8.0"]

[project.scripts]
etf-research = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

