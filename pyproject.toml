[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-event-research"
version = "0.3.0"
description = "大模型驱动的A股企业事件研究系统"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.12.5",
  "requests==2.32.5",
  "beautifulsoup4==4.14.3",
  "pypdf==6.19.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
market = ["akshare==1.18.97"]
dev = ["pytest==8.4.2", "httpx2==2.13.1"]

[project.scripts]
event-research = "app.cli:main"
event-research-api = "app.api.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

